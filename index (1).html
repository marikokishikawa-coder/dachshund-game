<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dachshund Adventure</title><style>*{box-sizing:border-box}body{margin:0;background:#fff3e6;color:#70452f;font:16px system-ui;text-align:center;overscroll-behavior:none}main{max-width:760px;margin:auto;padding:16px}h1{font-size:clamp(24px,6vw,38px);margin:8px}canvas{width:100%;display:block;border-radius:22px;touch-action:none;box-shadow:0 5px 20px #986b3530}button{border:0;border-radius:18px;padding:18px;background:#a85c42;color:white;font:bold 20px system-ui;width:100%;margin-top:12px;touch-action:manipulation}.stats{display:flex;justify-content:space-between;margin:12px 4px;font-weight:bold}p{font-size:14px}</style><main><h1>🐾 Dachshund Adventure</h1><div class="stats"><span id="score">Treats: 0</span><span id="best">Best: 0</span><span id="world">Garden</span></div><canvas id="game" width="640" height="400" aria-label="Dachshund jumping game"></canvas><button id="jump">Start adventure</button><p>Tap the game or button to jump. Collect bones and avoid obstacles!</p></main><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),btn=document.querySelector('#jump');let best=0;try{best=+localStorage.getItem('dachshundBest')||0}catch{}let state='ready',score=0,dist=0,y=0,vy=0,items=[],spawn=0,last=0;const ground=315;function rect(x,y,w,h,r,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function ellipse(x,y,a,b,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,a,b,0,0,Math.PI*2);g.fill()}function line(x,y,x2,y2,w,color){g.strokeStyle=color;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}function dog(x,b,t){ellipse(x+52,ground+5,52,7,'#00000018');line(x+8,b-34,x-13,b-49+Math.sin(t*12)*8,9,'#9b5734');rect(x,b-51,99,37,19,'#b66d3f');for(let i=0;i<4;i++){let xx=x+12+i*22;line(xx,b-22,xx+Math.sin(t*16+i*2)*7,b-3,11,'#94502e')}ellipse(x+98,b-55,28,29,'#bd7948');ellipse(x+119,b-43,23,14,'#d39762');ellipse(x+138,b-47,8,6,'#382820');g.save();g.translate(x+82,b-50);g.rotate(Math.sin(t*9)*.15+.15);ellipse(0,10,13,27,'#79422c');g.restore();ellipse(x+106,b-62,5,6,'#30241d');ellipse(x+107,b-64,1.8,2,'white');ellipse(x+113,b-49,6,3,'#ed9d91');line(x+85,b-29,x+96,b-24,7,'#e77b87');ellipse(x+96,b-20,5,5,'#f7d36d')}
function bone(x,y){line(x-11,y,x+11,y,9,'#fff5db');for(let a of [-12,12])for(let b of [-5,5])ellipse(x+a,y+b,6,6,'#fff5db')}
function action(){if(state!=='play'){state='play';score=0;dist=0;y=0;vy=0;items=[];spawn=0;btn.textContent='Jump! 🐾'}else if(y===0){vy=12.8}}btn.onclick=action;c.addEventListener('pointerdown',e=>{e.preventDefault();action()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)action()}});function frame(now){let dt=Math.min((now-last)/16.667||1,2);last=now;let t=now/1000;if(state==='play'){dist+=dt*(4+Math.min(3,dist/5000));y+=vy*dt;vy-=.55*dt;if(y<=0){y=0;vy=0}spawn-=dt;if(spawn<=0){items.push({x:680,type:Math.random()<.48?'bone':'rock'});spawn=65+Math.random()*42}for(let o of items){o.x-=dt*(4+Math.min(3,dist/5000));if(!o.hit&&o.x<193&&o.x>65){if(o.type==='bone'&&Math.abs(y-48)<75){o.hit=true;score++;if(score>best){best=score;try{localStorage.setItem('dachshundBest',best)}catch{}}}else if(o.type==='rock'&&o.x<175&&o.x>95&&y<34){state='over';btn.textContent='Play again ♡'}}}items=items.filter(o=>o.x>-50&&!o.hit)}let level=Math.floor(dist/2600)%3;let sky=['#fbe3d9','#dceee0','#d9f1fa'][level],land=['#a9d59a','#85bc9b','#f4d79d'][level];g.fillStyle=sky;g.fillRect(0,0,640,400);ellipse(540,65,33,33,'#fff5ba');for(let i=0;i<5;i++){let x=((i*180-dist*.15)%900+900)%900-100;ellipse(x,90+i%2*25,45,17,'#ffffffb0');ellipse(x+28,84+i%2*25,25,21,'#ffffffb0')}for(let i=0;i<6;i++){let x=((i*145-dist*.35)%870+870)%870-90;if(level===2){ellipse(x,270,100,45,'#82cbd9')}else{rect(x,188,12,110,6,'#b28a68');ellipse(x+6,178,level===1?38:49,65,level===1?'#679d80':'#91c99b')}}g.fillStyle=land;g.fillRect(0,ground,640,85);for(let i=0;i<12;i++){let x=((i*64-dist)%768+768)%768;line(x,350,x,340,2,'#739b69');ellipse(x,338,5,5,['#f8a4ae','#fff2a0','#fff'][i%3])}for(let o of items){if(o.type==='bone')bone(o.x,ground-82);else{ellipse(o.x,ground-12,21,17,'#9c8b83');ellipse(o.x-6,ground-19,10,6,'#bca9a0')}}dog(65,ground-y,t);if(state!=='play'){rect(95,55,450,135,22,'#fffaf0ed');g.fillStyle='#70452f';g.textAlign='center';g.font='bold 29px system-ui';g.fillText(state==='ready'?'Ready, little sausage?':'Good adventure!',320,105);g.font='18px system-ui';g.fillText(state==='ready'?'Jump, collect treats and explore!':`You collected ${score} treats!`,320,140)}document.querySelector('#score').textContent='Treats: '+score;document.querySelector('#best').textContent='Best: '+best;document.querySelector('#world').textContent=['Garden','Forest','Beach'][level];requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
