<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dachshund Adventure</title><style>*{box-sizing:border-box}body{margin:0;background:#fff3e6;color:#70452f;font:16px system-ui;text-align:center;overscroll-behavior:none}main{max-width:760px;margin:auto;padding:16px}h1{font-size:clamp(24px,6vw,38px);margin:8px}canvas{width:100%;display:block;border-radius:22px;touch-action:none;box-shadow:0 5px 20px #986b3530}button{border:0;border-radius:18px;padding:18px;background:#a85c42;color:white;font:bold 20px system-ui;width:100%;margin-top:12px;touch-action:manipulation}.stats{display:flex;justify-content:space-between;margin:12px 4px;font-weight:bold}p{font-size:14px}</style><main><h1>🐾 Dachshund Adventure 3.0</h1><label>Choose your puppy: <select id="puppy" style="font-size:17px;padding:8px;border-radius:12px"><option>Coco</option><option>Luna</option><option>Mocha</option><option>Mochi</option></select></label><div class="stats" style="flex-wrap:wrap;gap:8px"><span id="lives">❤️❤️❤️</span><span id="score">Score: 0</span><span id="best">Best: 0</span><span id="friends">Friends: 0</span><span id="world">Garden</span></div><canvas id="game" width="640" height="400" aria-label="Dachshund jumping game"></canvas><button id="jump">Start adventure</button><p>Tap twice to double jump! Run into friendly animals to meet them. Collect bones, hearts and stars.</p></main><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),btn=document.querySelector('#jump');let best=0;try{best=+localStorage.getItem('dachshundBest')||0}catch{}const puppy=document.querySelector('#puppy');const names=['Cozy Village','Sakura Town','Seaside Town','Woodland Village','Starlight Village'];const coats=[['#b66d3f','#bd7948','#d39762','#79422c'],['#302b29','#302b29','#c58a55','#211d1b'],['#75452f','#89543a','#ae795b','#503023'],['#e5c79a','#efd5ad','#f5dfbd','#c5a477']];const animals=[["🐰","Rabbit",20],["🐱","Kitten",30],["🐿️","Squirrel",25],["🦔","Hedgehog",35],["🐥","Duckling",20],["🦊","Fox",50],["🐶","Puppy",100]];let friends=0,met=new Set(),effects=[];let lives=3,jumps=0,shield=0,choice=0;let state='ready',score=0,dist=0,y=0,vy=0,items=[],spawn=0,last=0;const ground=315;function rect(x,y,w,h,r,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function ellipse(x,y,a,b,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,a,b,0,0,Math.PI*2);g.fill()}function line(x,y,x2,y2,w,color){g.strokeStyle=color;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}function dog(x,b,t){ellipse(x+52,ground+5,52,7,'#00000018');line(x+8,b-34,x-13,b-49+Math.sin(t*12)*8,9,coats[choice][0]);rect(x,b-51,99,37,19,coats[choice][0]);for(let i=0;i<4;i++){let xx=x+12+i*22;line(xx,b-22,xx+Math.sin(t*16+i*2)*7,b-3,11,coats[choice][3])}ellipse(x+98,b-55,28,29,coats[choice][1]);ellipse(x+119,b-43,23,14,coats[choice][2]);ellipse(x+138,b-47,8,6,'#382820');g.save();g.translate(x+82,b-50);g.rotate(Math.sin(t*9)*.15+.15);ellipse(0,10,13,27,coats[choice][3]);g.restore();ellipse(x+106,b-62,5,6,'#30241d');ellipse(x+107,b-64,1.8,2,'white');ellipse(x+113,b-49,6,3,'#ed9d91');line(x+85,b-29,x+96,b-24,7,'#e77b87');ellipse(x+96,b-20,5,5,'#f7d36d')}
function bone(x,y){line(x-11,y,x+11,y,9,'#fff5db');for(let a of [-12,12])for(let b of [-5,5])ellipse(x+a,y+b,6,6,'#fff5db')}
function house(x,b,i,level){let w=100+(i%3)*18,h=75+(i%2)*28;let walls=['#f9d8b5','#f6c9ce','#fff1c9','#d5e6cb','#c8c4e5'],roofs=['#b66b65','#9c637c','#559ba9','#86674e','#62557d'];rect(x,b-h,w,h,5,walls[level]);g.fillStyle=roofs[level];g.beginPath();g.moveTo(x-10,b-h+5);g.lineTo(x+w/2,b-h-47);g.lineTo(x+w+10,b-h+5);g.closePath();g.fill();rect(x+w-25,b-h-40,13,32,2,roofs[level]);rect(x+w/2-13,b-39,26,39,6,'#a67a65');ellipse(x+w/2+6,b-19,2,2,'#ffe4a0');for(let j of [15,w-37]){rect(x+j,b-h+18,22,26,3,'#fff7df');rect(x+j+3,b-h+21,16,20,2,level===4?'#ffda82':'#8fcbd8');line(x+j+11,b-h+21,x+j+11,b-h+41,2,'#fff7df');line(x+j+3,b-h+31,x+j+19,b-h+31,2,'#fff7df');rect(x+j-2,b-h+43,26,5,2,'#a77c65');for(let k=0;k<3;k++)ellipse(x+j+3+k*8,b-h+42,4,4,'#ed8da6')}ellipse(x+w/2,b-h-13,9,9,'#fff2c9');} 
function action(){if(state!=='play'){state='play';choice=puppy.selectedIndex;puppy.disabled=true;lives=3;jumps=0;shield=0;score=0;friends=0;met.clear();effects=[];dist=0;y=0;vy=0;items=[];spawn=0;btn.textContent='Jump! 🐾'}else if(jumps<2){vy=choice===1?14.5:12.8;jumps++}}btn.onclick=action;c.addEventListener('pointerdown',e=>{e.preventDefault();action()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)action()}});function frame(now){let dt=Math.min((now-last)/16.667||1,2);last=now;let t=now/1000;if(state==='play'){dist+=dt*(4+Math.min(5,dist/3500)+(choice===2?.6:0));y+=vy*dt;vy-=.55*dt;if(y<=0){y=0;vy=0;jumps=0}shield=Math.max(0,shield-dt);spawn-=dt;if(spawn<=0){let r=Math.random();items.push({x:680,type:r<.24?'bone':r<.29?'heart':r<.34?'star':r<.64?'friend':r<.82?'rock':'tall',animal:Math.floor(Math.random()*animals.length),height:Math.random()<.5?82:150});spawn=Math.max(38,75-dist/500)+Math.random()*35}for(let o of items){o.x-=dt*(4+Math.min(5,dist/3500)+(choice===2?.6:0));if(!o.hit&&o.x<193&&o.x>65){if(o.type==='friend'&&y<55){o.hit=true;friends++;met.add(o.animal);score+=animals[o.animal][2];effects.push({x:170,y:ground-100,life:95,text:'♥ '+animals[o.animal][1]+' +'+animals[o.animal][2]});}else if(['bone','heart','star'].includes(o.type)&&Math.abs(y-(o.height-48))<40){o.hit=true;if(o.type==='heart')lives=Math.min(3,lives+1);else if(o.type==='star')shield=300;else score+=choice===3?2:1;if(score>best){best=score;try{localStorage.setItem('dachshundBest',best)}catch{}}}else if(['rock','tall'].includes(o.type)&&o.x<175&&o.x>95&&y<(o.type==='tall'?75:34)){o.hit=true;if(shield<=0){lives--;shield=90;if(lives<=0){state='over';puppy.disabled=false;btn.textContent='Play again ♡'}}}}}items=items.filter(o=>o.x>-50&&!o.hit);if(score>best){best=score;try{localStorage.setItem("dachshundBest",best)}catch{}}for(const e of effects){e.life-=dt;e.y-=dt*.65}effects=effects.filter(e=>e.life>0)}let level=Math.floor(dist/2600)%5;let sky=['#fbe3d9','#dceee0','#d9f1fa','#e4f3ff','#34345c'][level],land=['#a9d59a','#85bc9b','#f4d79d','#eaf5ff','#8277a8'][level];g.fillStyle=sky;g.fillRect(0,0,640,400);ellipse(540,65,33,33,'#fff5ba');for(let i=0;i<5;i++){let x=((i*180-dist*.15)%900+900)%900-100;ellipse(x,90+i%2*25,45,17,'#ffffffb0');ellipse(x+28,84+i%2*25,25,21,'#ffffffb0')}for(let i=0;i<6;i++){let x=((i*145-dist*.35)%870+870)%870-90;if(level===2){ellipse(x,270,100,45,'#82cbd9')}else{rect(x,188,12,110,6,'#b28a68');ellipse(x+6,178,level===1?38:49,65,['#e9a8bd','#679d80','#91c99b','#d0e8f2','#58547c'][level])}}for(let i=0;i<7;i++){let x=((i*160-dist*.48)%1120+1120)%1120-150;house(x,ground-9,i,level)}g.fillStyle=land;g.fillRect(0,ground,640,85);rect(0,ground+7,640,22,0,"#e8c6a0");for(let i=0;i<12;i++){let x=((i*64-dist)%768+768)%768;line(x,350,x,340,2,'#739b69');ellipse(x,338,5,5,['#f8a4ae','#fff2a0','#fff'][i%3])}for(let o of items){if(o.type==='friend'){g.font='43px system-ui';g.textAlign='center';g.fillText(animals[o.animal][0],o.x,ground-3-Math.abs(Math.sin(t*5+o.x*.02))*5);g.font='16px system-ui';g.fillText('♥',o.x,ground-51);}else if(o.type==='bone')bone(o.x,ground-o.height);else if(o.type==='heart'||o.type==='star'){g.font='32px system-ui';g.textAlign='center';g.fillText(o.type==='heart'?'❤️':'⭐',o.x,ground-o.height+10)}else if(o.type==='tall'){rect(o.x-17,ground-70,34,70,8,['#b87d65','#946344','#dfad62','#a7c6e0','#66547f'][level]);g.font='26px system-ui';g.textAlign='center';g.fillText(['🌷','🍄','🦀','⛄','🦇'][level],o.x,ground-55)}else{ellipse(o.x,ground-12,21,17,'#9c8b83');ellipse(o.x-6,ground-19,10,6,'#bca9a0')}}if(shield>0){g.strokeStyle='#f5c85b';g.lineWidth=4;g.beginPath();g.ellipse(135,ground-y-40,84,52,0,0,Math.PI*2);g.stroke()}dog(65,ground-y,t);for(const e of effects){g.save();g.globalAlpha=Math.min(1,e.life/25);g.font="bold 19px system-ui";g.textAlign="center";g.strokeStyle="white";g.lineWidth=4;g.strokeText(e.text,e.x,e.y);g.fillStyle="#c34d80";g.fillText(e.text,e.x,e.y);g.restore()}if(state!=='play'){rect(95,55,450,135,22,'#fffaf0ed');g.fillStyle='#70452f';g.textAlign='center';g.font='bold 29px system-ui';g.fillText(state==='ready'?'Ready, little sausage?':'Good adventure!',320,105);g.font='18px system-ui';g.fillText(state==='ready'?'Jump, collect treats and explore!':`Score ${score} • ${friends} friends!`,320,140)}document.querySelector('#score').textContent='Score: '+score;document.querySelector('#friends').textContent='Friends: '+friends+' ('+met.size+'/7)';document.querySelector('#best').textContent='Best: '+best;document.querySelector('#world').textContent=names[level];document.querySelector('#lives').textContent='❤️'.repeat(Math.max(0,lives))+'♡'.repeat(3-Math.max(0,lives));requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
